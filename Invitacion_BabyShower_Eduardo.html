<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; overflow:hidden; background:#0a3550; }
  .card { position:relative; width:1080px; height:1920px; overflow:hidden;
    background: linear-gradient(180deg,#fdf6e9 0%,#e3f4f7 22%,#8fd3e0 38%,#3fa7c4 55%,#1b6f99 75%,#0b3d5c 100%); }
  svg.bg { position:absolute; inset:0; }
  .content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .top { margin-top:150px; font-family:'Quicksand',sans-serif; font-weight:700; letter-spacing:10px;
    color:#1b6f99; font-size:34px; text-transform:uppercase; }
  .title { font-family:'Pacifico',cursive; font-size:150px; color:#0b4f73; line-height:1.15; margin-top:10px;
    text-shadow: 0 4px 0 #fff, 0 10px 24px rgba(11,79,115,.25); }
  .sub { font-family:'Playfair Display',serif; font-style:italic; font-size:44px; color:#22617f; margin-top:6px; }
  .name-wrap { margin-top:300px; }
  .name1 { font-family:'Playfair Display',serif; font-weight:800; font-size:96px; color:#fff;
    text-shadow:0 4px 18px rgba(0,40,70,.45); line-height:1.05; }
  .name2 { font-family:'Playfair Display',serif; font-weight:600; font-size:58px; color:#e6f7fb; letter-spacing:3px; margin-top:12px;

  .divider { margin:34px auto 0; width:520px; height:40px; }
  .info { margin-top:40px; display:flex; gap:28px; justify-content:center; }
  .pill { background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.45); border-radius:36px;
    padding:26px 34px; color:#fff; font-family:'Quicksand',sans-serif; backdrop-filter: blur(4px); min-width:290px; }
  .pill .k { font-size:24px; letter-spacing:6px; text-transform:uppercase; opacity:.85; font-weight:700; }
  .pill .v { font-size:46px; font-weight:700; margin-top:6px; }
  .pill .s { font-size:28px; margin-top:2px; opacity:.95; }
  .place { margin-top:44px; display:flex; align-items:center; gap:34px; background:#fdf6e9; border-radius:40px;
    padding:26px 40px 26px 26px; box-shadow:0 18px 40px rgba(0,20,40,.35); }
  .place .qr { width:200px; height:200px; background:#fff; border-radius:22px; padding:10px; }
  .place .qr svg { width:100%; height:100%; }
  .place .txt { text-align:left; font-family:'Quicksand',sans-serif; color:#0b3d5c; }
  .place .txt .k { font-size:24px; letter-spacing:6px; text-transform:uppercase; color:#3fa7c4; font-weight:700; }
  .place .txt .v { font-family:'Playfair Display',serif; font-weight:800; font-size:50px; line-height:1.1; margin-top:4px; }
  .place .txt .s { font-size:30px; margin-top:6px; font-weight:500; }
  .place .txt .h { font-size:24px; margin-top:12px; color:#1b6f99; font-weight:700; }
  .foot { position:absolute; bottom:28px; width:100%; text-align:center; font-family:'Pacifico',cursive;
    color:#0b4f73; font-size:46px; }
